name: HouseTrip
description: 'HouseTrip was a London-based online vacation-rental marketplace founded in 2009 by Arnaud
  Bertrand and Junjun Chen, backed by Accel and Balderton Capital, that grew to roughly 300,000 European
  holiday properties before being acquired by TripAdvisor in April 2016. The standalone HouseTrip brand
  and its developer surface (formerly dev.housetrip.com) have since been retired; the housetrip.com domain
  now serves TripAdvisor''s HolidayLettings marketplace. This profile is retained as a historical
  consumer-sector company record in the API Evangelist network; no live first-party API, SDK, or
  developer portal is currently published under the HouseTrip brand.'
